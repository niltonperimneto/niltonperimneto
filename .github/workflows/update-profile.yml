name: Update Profile Telemetry

on:
  schedule:
    # Off-peak UTC (00:17 BRT) to avoid midnight GitHub Actions queue congestion
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'config.json'
      - 'generator/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate & Validate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 generator/generate.py
          python3 -c '
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("assets/*.svg")
          assert files, "No SVG files found in assets/!"
          for f in files:
              ET.parse(f)
              print(f"Validated XML: {f}")
          '

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore: sync profile telemetry [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
