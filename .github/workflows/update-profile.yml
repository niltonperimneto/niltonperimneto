name: Update Profile Cards

on:
  schedule:
    # Off-peak UTC (00:17 BRT) to avoid midnight GitHub Actions queue congestion
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'config.json'
      - 'generator/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test generator
        run: python3 -m unittest discover -s tests -v

      - name: Generate and validate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 generator/generate.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No profile changes detected."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
