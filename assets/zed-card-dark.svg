<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', 'SF Mono', Monaco, Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
      }

      .draw-stroke {
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        animation: drawPath 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .fade-in {
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
      }

      .delay-1 { animation-delay: 0.25s; }
      .delay-2 { animation-delay: 0.5s; }
      .delay-3 { animation-delay: 0.75s; }

      .pulse-marker {
        animation: pulse 2.2s infinite ease-in-out;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }

      .scan-line {
        animation: scan 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes drawPath {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% { r: 3; opacity: 1; }
        50% { r: 6.5; opacity: 0.25; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes scan {
        0% { transform: translateX(0px); opacity: 0; }
        12% { opacity: 0.6; }
        88% { opacity: 0.6; }
        100% { transform: translateX(385px); opacity: 0; }
      }
    </style>

    <linearGradient id="areaGrad_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="gridPattern_dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1e" stroke-width="0.75"/>
