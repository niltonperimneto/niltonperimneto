  <!-- ==================== FOOTER ==================== -->
  <g class="fade-in delay-3">
    <line x1="24" y1="346" x2="826" y2="346" stroke="#d1d5db" stroke-width="1"/>
    
    <text x="28" y="364" font-size="10" font-weight="400" fill="#94a3b8">Universidade Federal de Goiás · Goiás, Brazil</text>
