<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .tabular {
        font-variant-numeric: tabular-nums;
      }

      .draw-stroke {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: drawPath 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .fade-in {
        opacity: 0;
        animation: fadeIn 0.5s ease forwards;
      }

      .delay-1 { animation-delay: 0.1s; }
      .delay-2 { animation-delay: 0.2s; }
      .delay-3 { animation-delay: 0.3s; }

      .pulse-marker {
        animation: pulse 2.4s infinite ease-in-out;
        transform-origin: center;
        transform-box: fill-box;
      }

      @keyframes drawPath {
        to { stroke-dashoffset: 0; }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(2.2); opacity: 0.25; }
      }
    </style>

    <linearGradient id="curveGrad_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Card Background (Sharp Angles) -->
  <rect width="850" height="380" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="849" height="379" fill="none" stroke="#d1d5db" stroke-width="1"/>

  <!-- ==================== HEADER ==================== -->
  <g class="fade-in">
    <!-- Monogram Square -->
    <rect x="28" y="24" width="30" height="30" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
    <text x="43" y="43" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">NP</text>

    <!-- Name & Tagline -->
    <text x="70" y="36" font-size="15" font-weight="600" fill="#0f172a" letter-spacing="-0.01em">Nilton Perim Neto</text>
    <text x="70" y="51" font-size="11" font-weight="400" fill="#475569">Not a Programmer, just a historian.</text>

    <!-- Status Badge (Sharp Box) -->
    <rect x="636" y="25" width="190" height="28" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
    <rect x="649" y="36" width="6" height="6" fill="#475569"/>
    <text x="664" y="43" font-size="11" font-weight="500" fill="#475569">Systems &amp; Open Source</text>

    <!-- Header Divider -->
    <line x1="24" y1="72" x2="826" y2="72" stroke="#d1d5db" stroke-width="1"/>
  </g>

  <!-- ==================== METRICS & LANGUAGES ==================== -->
  <g class="fade-in delay-1">
    <!-- Panel Container (Sharp Box) -->
    <rect x="24" y="86" width="368" height="148" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>

    <!-- Stat 1: Repositories -->
    <text x="44" y="110" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#94a3b8">REPOSITORIES</text>
    <text x="44" y="136" font-size="20" font-weight="600" fill="#0f172a" class="tabular">30</text>

    <!-- Stat 2: Contributions -->
    <text x="168" y="110" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#94a3b8">YEARLY COMMITS</text>
    <text x="168" y="136" font-size="20" font-weight="600" fill="#0f172a" class="tabular">963</text>

    <!-- Stat 3: Peak Activity -->
    <text x="292" y="110" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#94a3b8">WEEKLY PEAK</text>
    <text x="292" y="136" font-size="20" font-weight="600" fill="#0f172a" class="tabular">163</text>

    <!-- Sub-divider -->
    <line x1="44" y1="152" x2="372" y2="152" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Languages Header -->
    <text x="44" y="174" font-size="11" font-weight="600" fill="#475569">Primary Languages</text>

    <!-- Multi-segment Sharp Bar -->
    <g>
      <rect x="44" y="184" width="137.8" height="6" fill="#0f172a"/>
      <rect x="181.76" y="184" width="91.8" height="6" fill="#475569"/>
      <rect x="273.6" y="184" width="59.0" height="6" fill="#94a3b8"/>
      <rect x="332.64000000000004" y="184" width="39.4" height="6" fill="#cbd5e1"/>
    </g>

    <!-- Language Legend (Sharp Squares) -->
    <g font-size="10" font-weight="500" fill="{text_secondary}">
      <rect x="44" y="209" width="6" height="6" fill="#0f172a"/>
      <text x="54" y="215" fill="#475569">Rust <tspan font-weight="400" fill="#94a3b8">42%</tspan></text>
      <rect x="130" y="209" width="6" height="6" fill="#475569"/>
      <text x="140" y="215" fill="#475569">TypeScript <tspan font-weight="400" fill="#94a3b8">28%</tspan></text>
      <rect x="230" y="209" width="6" height="6" fill="#94a3b8"/>
      <text x="240" y="215" fill="#475569">Python <tspan font-weight="400" fill="#94a3b8">18%</tspan></text>
      <rect x="310" y="209" width="6" height="6" fill="#cbd5e1"/>
      <text x="320" y="215" fill="#475569">C / Asm <tspan font-weight="400" fill="#94a3b8">12%</tspan></text>
    </g>
  </g>

  <!-- ==================== ACTIVITY TRAJECTORY ==================== -->
