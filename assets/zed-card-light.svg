      <text x="12" y="45" font-size="9.5" font-weight="400" fill="#475569">DBus daemon for high-end gaming mice</text>
      
      <!-- Tech Badge (Sharp Box) -->
      <rect x="12" y="57" width="78" height="17" fill="#f1f5f9" stroke="#d1d5db" stroke-width="0.75"/>
      <text x="51.0" y="69" text-anchor="middle" font-size="8.5" font-weight="500" fill="#94a3b8">Rust / DBus</text>
    </g>
    <!-- Project Card 4 (Sharp Angles) -->
    <g transform="translate(627, 248)">
      <rect width="199" height="84" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>
      <text x="12" y="25" font-size="12" font-weight="600" fill="#0f172a">lemurs</text>
      
      <text x="12" y="45" font-size="9.5" font-weight="400" fill="#475569">Customizable TUI display &amp; login ...</text>
      
      <!-- Tech Badge (Sharp Box) -->
