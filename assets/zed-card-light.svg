    <text x="806" y="110" text-anchor="end" font-size="10" font-weight="500" fill="#94a3b8">52-Week Trajectory</text>

    <!-- Guide Lines -->
    <line x1="428" y1="202" x2="806" y2="202" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="428" y1="167.0" x2="806" y2="167.0" stroke="#e5e7eb" stroke-dasharray="3,4" stroke-width="0.75"/>

    <!-- Gradient Fill -->
    <path d="M 430.0 200.7 L 437.4 202.0 L 444.7 202.0 L 452.1 202.0 L 459.5 202.0 L 466.9 202.0 L 474.2 202.0 L 481.6 201.6 L 489.0 202.0 L 496.4 202.0 L 503.7 132.0 L 511.1 184.4 L 518.5 190.0 L 525.8 201.1 L 533.2 193.4 L 540.6 187.0 L 548.0 199.9 L 555.3 179.2 L 562.7 201.6 L 570.1 202.0 L 577.5 201.1 L 584.8 202.0 L 592.2 197.7 L 599.6 193.4 L 606.9 199.9 L 614.3 171.9 L 621.7 192.6 L 629.1 195.1 L 636.4 199.4 L 643.8 202.0 L 651.2 202.0 L 658.5 201.6 L 665.9 197.3 L 673.3 202.0 L 680.7 194.7 L 688.0 202.0 L 695.4 198.6 L 702.8 184.8 L 710.2 196.0 L 717.5 190.0 L 724.9 195.1 L 732.3 197.7 L 739.6 202.0 L 747.0 202.0 L 754.4 202.0 L 761.8 202.0 L 769.1 202.0 L 776.5 200.3 L 783.9 175.8 L 791.3 157.8 L 798.6 166.4 L 806.0 174.5 L 806.0 202 L 430.0 202 Z" fill="url(#curveGrad_light)"/>

    <!-- Sharp Angular Trajectory Stroke -->
    <path class="draw-stroke" d="M 430.0 200.7 L 437.4 202.0 L 444.7 202.0 L 452.1 202.0 L 459.5 202.0 L 466.9 202.0 L 474.2 202.0 L 481.6 201.6 L 489.0 202.0 L 496.4 202.0 L 503.7 132.0 L 511.1 184.4 L 518.5 190.0 L 525.8 201.1 L 533.2 193.4 L 540.6 187.0 L 548.0 199.9 L 555.3 179.2 L 562.7 201.6 L 570.1 202.0 L 577.5 201.1 L 584.8 202.0 L 592.2 197.7 L 599.6 193.4 L 606.9 199.9 L 614.3 171.9 L 621.7 192.6 L 629.1 195.1 L 636.4 199.4 L 643.8 202.0 L 651.2 202.0 L 658.5 201.6 L 665.9 197.3 L 673.3 202.0 L 680.7 194.7 L 688.0 202.0 L 695.4 198.6 L 702.8 184.8 L 710.2 196.0 L 717.5 190.0 L 724.9 195.1 L 732.3 197.7 L 739.6 202.0 L 747.0 202.0 L 754.4 202.0 L 761.8 202.0 L 769.1 202.0 L 776.5 200.3 L 783.9 175.8 L 791.3 157.8 L 798.6 166.4 L 806.0 174.5" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="miter"/>

    <!-- Peak Indicator (Sharp Square) -->
    <g transform="translate(503.7, 132.0)">
      <rect x="-3" y="-3" width="6" height="6" fill="#1e293b"/>
      <rect x="-3" y="-3" width="6" height="6" fill="none" stroke="#1e293b" stroke-width="0.8" class="pulse-marker"/>
      <text x="0" y="-10" text-anchor="middle" font-size="9" font-weight="600" fill="#0f172a">Peak: 163</text>
    </g>

    <!-- Timeline Labels -->
    <g font-size="9.5" font-weight="500" fill="#94a3b8">
      <text x="430" y="221">Q1</text>
      <text x="554.1" y="221" text-anchor="middle">Q2</text>
      <text x="678.2" y="221" text-anchor="middle">Q3</text>
      <text x="806" y="221" text-anchor="end">Q4</text>
    </g>
  </g>

  <!-- ==================== FEATURED PROJECTS ==================== -->
