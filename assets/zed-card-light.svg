<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .tabular {
        font-variant-numeric: tabular-nums;
      }

      .draw-stroke {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: drawPath 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .fade-in {
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }

      .delay-1 { animation-delay: 0.15s; }
      .delay-2 { animation-delay: 0.3s; }
      .delay-3 { animation-delay: 0.45s; }

      .pulse-marker {
        animation: pulse 2.4s infinite ease-in-out;
      }

      @keyframes drawPath {
        to { stroke-dashoffset: 0; }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      @keyframes pulse {
        0%, 100% { r: 3; opacity: 1; }
        50% { r: 5.5; opacity: 0.3; }
      }
    </style>

    <linearGradient id="curveGrad_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2328" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1f2328" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="langBarClip">
      <rect x="44" y="184" width="328" height="7" rx="3.5"/>
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect width="850" height="380" fill="#ffffff" rx="12"/>
  <rect x="0.5" y="0.5" width="849" height="379" fill="none" stroke="#d0d7de" stroke-width="1" rx="11.5"/>

  <!-- ==================== HEADER ==================== -->
  <g class="fade-in">
    <!-- Monogram Circle -->
    <circle cx="44" cy="38" r="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="44" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">NP</text>

    <!-- Name & Tagline -->
    <text x="70" y="34" font-size="16" font-weight="600" fill="#1f2328" letter-spacing="-0.01em">Nilton Perim Neto</text>
    <text x="70" y="50" font-size="11.5" font-weight="400" fill="#57606a">Not a Programmer, just a historian.</text>

    <!-- Status Badge -->
    <rect x="636" y="24" width="190" height="28" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="14"/>
    <circle cx="652" cy="38" r="3.5" fill="#1a7f37"/>
    <text x="664" y="42" font-size="11" font-weight="500" fill="#57606a">Systems &amp; Open Source</text>

    <!-- Header Divider -->
    <line x1="24" y1="72" x2="826" y2="72" stroke="#d0d7de" stroke-width="1"/>
  </g>

  <!-- ==================== METRICS & LANGUAGES ==================== -->
  <g class="fade-in delay-1">
    <!-- Panel Container -->
    <rect x="24" y="86" width="368" height="148" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="10"/>

    <!-- Stat 1: Repositories -->
    <text x="44" y="110" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#8c959f">REPOSITORIES</text>
    <text x="44" y="136" font-size="20" font-weight="600" fill="#1f2328" class="tabular">30</text>

    <!-- Stat 2: Contributions -->
    <text x="168" y="110" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#8c959f">YEARLY COMMITS</text>
    <text x="168" y="136" font-size="20" font-weight="600" fill="#1f2328" class="tabular">963</text>

    <!-- Stat 3: Peak Activity -->
